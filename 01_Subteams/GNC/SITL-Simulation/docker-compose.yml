services:
  ardusub-sitl:
    build:
      context: .
      args:
        ARDUSUB_REF: Sub-4.5
    image: gnc-ardusub-sitl:latest
    container_name: ardusub-sitl
    ports:
      - "5780:5780"   # MAVLink TCP -> pymavlink / GNC scripts
      - "5781:5781"   # MAVLink TCP -> QGroundControl
    volumes:
      - ./params:/sim/params:ro
    stdin_open: true
    tty: true
